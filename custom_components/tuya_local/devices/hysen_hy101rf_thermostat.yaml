name: Thermostat
products:
  - id: 9u1pognermrqhicq
    manufacturer: Hysen
    model: HY101RF
  - id: 9u1pognermrqhicq
    manufacturer: Ketotek
    model: KTF0186C
    model_id: WBR3-HYWE_v3.0
  - id: hlbr5y67unkyfpfs
    manufacturer: Ketotek
    model: KTF017802
  - id: bf9e1059e373dda7a59wvu
    manufacturer: Domyno
    model: Dynamo v4.0
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: level
            conditions:
              - dps_val: cool
                value: cool
              - dps_val: heat
                value: heat
      - id: 3
        type: integer
        name: temperature
        range:
          min: 50
          max: 700
        mapping:
          - scale: 10
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: Manual
            value: manual
          - dps_val: Program
            value: program
          - dps_val: Holiday
            value: away
          - dps_val: TempProg
            value: temp_override
      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 28
        type: string
        name: level
        optional: true
        hidden: true
      - id: 102
        type: boolean
        name: hvac_action
        optional: true
        mapping:
          - dps_val: false
            value: idle
          - dps_val: true
            value: heating
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 6
        type: boolean
        name: lock
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    icon: "mdi:thermometer-check"
    dps:
      - id: 109
        type: integer
        name: value
        unit: C
        range:
          min: -90
          max: 90
        mapping:
          - scale: 10
  - entity: number
    translation_key: maximum_temperature
    category: config
    class: temperature
    dps:
      - id: 114
        type: integer
        name: value
        range:
          min: 20
          max: 70
  - entity: number
    translation_key: minimum_temperature
    category: config
    class: temperature
    dps:
      - id: 115
        type: integer
        name: value
        range:
          min: 1
          max: 10
